<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List — lista de tarefas offline</title>

    <meta name="description" content="Lista de tarefas simples, rápida e offline, nos temas claro e escuro. Salva tudo no navegador e pode ser instalada como app.">
    <meta name="author" content="Bruno Lira">
    <meta name="theme-color" content="#0fa3b1">
    <meta name="color-scheme" content="light dark">
    <meta name="robots" content="index, follow">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:site_name" content="To Do List">
    <meta property="og:url" content="https://todo-list.bruno-oli-lira.workers.dev/">
    <meta property="og:title" content="To Do List — lista de tarefas offline">
    <meta property="og:description" content="Lista de tarefas simples, rápida e offline, nos temas claro e escuro. Salva tudo no navegador e pode ser instalada como app.">
    <!-- Ao publicar, troque por uma URL absoluta (ex.: https://seu-dominio/to-do-list/src/screenshot-light.png) -->
    <meta property="og:image" content="src/screenshot-light.png">
    <meta property="og:image:width" content="780">
    <meta property="og:image:height" content="1020">
    <meta property="og:image:alt" content="Bloquinho de papel pautado com tarefas, no tema claro do To Do List">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="To Do List — lista de tarefas offline">
    <meta name="twitter:description" content="Lista de tarefas simples, rápida e offline, nos temas claro e escuro. Salva tudo no navegador e pode ser instalada como app.">
    <meta name="twitter:image" content="src/screenshot-light.png">

    <!-- PWA e favicon -->
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div style="display: flex; flex-direction: row; gap: 20px; align-items: center; justify-content: center;">
        <a href="https://app-library.bruno-oli-lira.workers.dev/" style="display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none;">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
                <path
                    d="M240,208H224V136l2.34,2.34A8,8,0,0,0,237.66,127L139.31,28.68a16,16,0,0,0-22.62,0L18.34,127a8,8,0,0,0,11.32,11.31L32,136v72H16a8,8,0,0,0,0,16H240a8,8,0,0,0,0-16Zm-88,0H104V160a4,4,0,0,1,4-4h40a4,4,0,0,1,4,4Z">
                </path>
            </svg>
            Conhecer outros apps
        </a>
    </div>

    <div class="container">
        <div id="list-container">
            <ul id="item-list"></ul>
        </div>
        <div class="button-container">
            <input type="text" id="item-name">
            <button id="add">
                <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 256 256">
                    <path
                        d="M228,128a12,12,0,0,1-12,12H140v76a12,12,0,0,1-24,0V140H40a12,12,0,0,1,0-24h76V40a12,12,0,0,1,24,0v76h76A12,12,0,0,1,228,128Z">
                    </path>
                </svg>
            </button>
            <button id="clear">
                <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 256 256">
                    <path
                        d="M216,48H180V36A28,28,0,0,0,152,8H104A28,28,0,0,0,76,36V48H40a12,12,0,0,0,0,24h4V208a20,20,0,0,0,20,20H192a20,20,0,0,0,20-20V72h4a12,12,0,0,0,0-24ZM100,36a4,4,0,0,1,4-4h48a4,4,0,0,1,4,4V48H100Zm88,168H68V72H188ZM116,104v64a12,12,0,0,1-24,0V104a12,12,0,0,1,24,0Zm48,0v64a12,12,0,0,1-24,0V104a12,12,0,0,1,24,0Z">
                    </path>
                </svg>
            </button>
        </div>
    </div>

    <div style="display: flex; flex-direction: row; gap: 20px; align-items: center; justify-content: center;">
        <span style="color: var(--text)">Feito por Bruno Lira</span>
        <a href="https://github.com/brunolieps/to-do-list" target="_blank" rel="noopener noreferrer">
            <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="var(--text)" viewBox="0 0 256 256">
                <path
                    d="M216,104v8a56.06,56.06,0,0,1-48.44,55.47A39.8,39.8,0,0,1,176,192v40a8,8,0,0,1-8,8H104a8,8,0,0,1-8-8V216H72a40,40,0,0,1-40-40A24,24,0,0,0,8,152a8,8,0,0,1,0-16,40,40,0,0,1,40,40,24,24,0,0,0,24,24H96v-8a39.8,39.8,0,0,1,8.44-24.53A56.06,56.06,0,0,1,56,112v-8a58.14,58.14,0,0,1,7.69-28.32A59.78,59.78,0,0,1,69.07,28,8,8,0,0,1,76,24a59.75,59.75,0,0,1,48,24h24a59.75,59.75,0,0,1,48-24,8,8,0,0,1,6.93,4,59.74,59.74,0,0,1,5.37,47.68A58,58,0,0,1,216,104Z">
                </path>
            </svg>
        </a>
        <button id="darkmodetoggle">
            <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="var(--text)" viewBox="0 0 256 256">
                <path
                    d="M235.54,150.21a104.84,104.84,0,0,1-37,52.91A104,104,0,0,1,32,120,103.09,103.09,0,0,1,52.88,57.48a104.84,104.84,0,0,1,52.91-37,8,8,0,0,1,10,10,88.08,88.08,0,0,0,109.8,109.8,8,8,0,0,1,10,10Z">
                </path>
            </svg>
        </button>
    </div>

    <script src="todo.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js', {
                    scope: './',
                    updateViaCache: 'none'
                })
                    .then((registration) => {
                        console.info('Service Worker registrado:', registration.scope);
                    })
                    .catch((error) => {
                        console.error('Falha ao registrar Service Worker:', error);
                    });
            });
        }
    </script>
</body>

</html>
